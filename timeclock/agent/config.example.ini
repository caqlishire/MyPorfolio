; Copy this file to config.ini and fill in the values.

[clock]
; From the clock: Menu > COMM. > App Connection
ip = 192.168.0.32
port = 4370
comm_key = 0
; Set to true only if the test fails with TCP but works with UDP
force_udp = false

[server]
; Your dashboard address, e.g. https://my-timeclock.onrender.com
url = https://YOUR-DASHBOARD-ADDRESS
; Must match the AGENT_KEY setting on the server
agent_key = PASTE-AGENT-KEY-HERE

[sync]
interval_minutes = 5
